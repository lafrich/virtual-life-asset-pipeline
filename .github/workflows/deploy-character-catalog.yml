name: Character Stock — Build and Deploy

on:
  push:
    branches:
      - main
      - feature/character-stock-landing
      - feature/milk-mascot-arms-angled-label-expressions
      - feature/xp-paint-character-stock-ui
      - feature/animation-library-paint-and-templates
      - feature/mixamo-character-motion-lab
      - feature/import-virtual-life-npc-motion-inventory
      - fix/curate-legacy-and-animated-faces
      - fix/facial-preview-click-feedback
      - feature/life-sim-animation-roadmap-v1
      - feature/register-life-sim-actions-in-motion-db
      - feature/mixamo-model-rig-studio-v1
      - feature/add-otis-helmeted-character
      - feature/otis-native-pixel-editor
      - feature/master-parts-editor-on-character-landing
      - fix/otis-compact-helmet-flat-rear
      - fix/otis-helmet-facing-orientation
      - feature/shared-category-skeletons-remove-rig-ui
    paths:
      - ".github/workflows/deploy-character-catalog.yml"
      - "assets/**"
      - "site/**"
      - "tools/build_character_catalog.py"
      - "tools/build_rig_studio.py"
      - "tests/test_rig_studio.py"
      - "tests/test_otis_helmet.py"
      - "tests/test_pixel_patch.py"
      - "tests/test_pixel_editor.cjs"
      - "tests/test_accessory_editor.cjs"
      - "tools/build_accessory_guide.py"
      - "tools/build_astrofrich.py"
      - "tools/build_human_templates.py"
      - "assets/npc_preview_v2/make_npcs_v2.py"
      - "tests/test_bald_nape.py"
      - "tests/test_rear_head_v6b.py"
      - "tests/test_human_outline.py"
      - "tests/test_shared_arm_attachment.py"
      - "tests/test_theodore_backpack_layer.py"
      - "chars-iso/v6b/tools/live_v6b.py"
      - "tests/test_master_parts.cjs"
      - "tests/test_rig_runtime.cjs"
      - "tests/test_shared_bone_runtime.cjs"
      - "assets/animation_library/category_skeletons.json"
      - "assets/animation_library/shared_bone_motions.json"
      - "tools/build_native_character_catalog.py"
      - "tools/build_legacy_character_catalog.py"
      - "tools/build_legacy_face_previews.py"
      - "tests/test_face_ui_interactions.cjs"
      - "tools/generate_archive_previews.py"
      - "assets/animation_library/actions.json"
      - "assets/npc_*/motions.json"
      - "tests/test_character_motion_studio.py"
      - "tests/test_legacy_face_previews.py"
      - "tools/build_animation_catalog.py"
      - "tools/animation_backlog.py"
      - "tests/test_animation_backlog.py"
      - "tools/new_animation_template.py"
      - "tools/pack_animation_preview.py"
      - "tests/test_animation_catalog.py"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: character-stock-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout character library
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Python and Pillow
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install image dependency
        run: python -m pip install -r requirements.txt
      - name: Validate JavaScript and Python
        run: |
          node --check site/app.js
          node --check site/animations.js
          node --check site/pixel-edit-core.js
          node --check site/pixel-editor.js
          node --check site/accessory-editor.js
          node tests/test_accessory_editor.cjs
          node --check site/master-parts.js
          node tests/test_master_parts.cjs
          node tests/test_pixel_editor.cjs
          node --check site/rig-runtime.js
          node --check site/shared-bone-runtime.js
          node tests/test_shared_bone_runtime.cjs
          node tests/test_rig_runtime.cjs
          node tests/test_face_ui_interactions.cjs
          python -m py_compile tools/build_accessory_guide.py tools/build_astrofrich.py tools/build_human_templates.py
          python -m unittest discover -s tests -p "test_bald_nape.py" -v
          python -m unittest discover -s tests -p "test_rear_head_v6b.py" -v
          python -m unittest discover -s tests -p "test_human_outline.py" -v
          python -m unittest discover -s tests -p "test_shared_arm_attachment.py" -v
          python -m unittest discover -s tests -p "test_theodore_backpack_layer.py" -v
          python -m py_compile tools/build_rig_studio.py tools/build_character_catalog.py tools/animation_backlog.py tools/build_animation_catalog.py tools/new_animation_template.py tools/pack_animation_preview.py tools/build_native_character_catalog.py tools/build_legacy_character_catalog.py tools/build_legacy_face_previews.py tools/generate_archive_previews.py
          python -m unittest discover -s tests -p 'test_animation_catalog.py' -v
          python -m unittest discover -s tests -p 'test_rig_studio.py' -v
          python -m unittest discover -s tests -p 'test_otis_helmet.py' -v
          python -m unittest discover -s tests -p 'test_pixel_patch.py' -v
          python -m unittest discover -s tests -p 'test_animation_backlog.py' -v
          python -m unittest discover -s tests -p 'test_character_motion_studio.py' -v
          python -m unittest discover -s tests -p 'test_legacy_face_previews.py' -v
      - name: Render native roster and legacy NPC motion frames
        run: python tools/generate_archive_previews.py
      - name: Build auto-discovered character catalog
        run: python tools/build_character_catalog.py
      - name: Check built site files
        run: |
          test -s _site/index.html
          test -s _site/style.css
          test -s _site/app.js
          test -s _site/catalog.json
          test -s _site/pixel-editor.html
          test -s _site/accessory-editor.html
          test -s _site/accessory-editor.css
          test -s _site/accessory-editor.js
          test -s _site/media/theodore-accessory-fitting-guide.png
          test -s _site/media/astrofrich-base-sheet.png
          test -s _site/media/human-male-base-sheet.png
          test -s _site/media/human-female-base-sheet.png
          test -s _site/media/human-male-base-guide.png
          test -s _site/media/human-female-base-guide.png
          python -c 'from PIL import Image; import json; from pathlib import Path; data=json.loads(Path("_site/catalog.json").read_text()); ids={c["id"] for c in data["characters"]}; assert "legacy_otis" not in ids and "otis" not in ids; bases=[c for c in data["characters"] if c.get("template_category")=="human"]; assert {c["id"] for c in bases}=={"human_male_base","human_female_base"}; assert all(len(c["expressions"])==5 and len([m for m in c["motions"] if m["available"]])==7 for c in bases); assert all(Image.open("_site/media/human-"+g+"-base-guide.png").size==(256,112) for g in ("male","female")); print("Otis retired, Human Male and Female full modular sprite atlases valid")'
          test -s _site/media/astrofrich-base-thumb.png
          test -s _site/media/astrofrich-base-expression-happy.png
          test -s _site/media/astrofrich-base-action-sit_type.png
          python -c 'import json; from pathlib import Path; from PIL import Image; data=json.loads(Path("_site/catalog.json").read_text()); chars=[c for c in data["characters"] if c["id"]=="astrofrich_base"]; assert len(chars)==1; ch=chars[0]; assert ch["template_category"]=="astrofrich" and len(ch["expressions"])==5; assert set(m["id"] for m in ch["motions"] if m["available"])=={"walk","idle","sit","sit_type","sleep_seat","nap_stand","talk"}; sheet=Image.open("_site/media/astrofrich-base-sheet.png"); assert sheet.size==(384,4928); assert Image.open("_site/media/astrofrich-base-action-talk.png").size==(256,448); print("Astrofrich base: 4 directions / 7 authored actions / 5 expressions")'
          python -c 'from PIL import Image; im=Image.open("_site/media/theodore-accessory-fitting-guide.png"); assert im.size==(256,112) and im.mode=="RGBA"; assert all(im.crop((64*i,0,64*(i+1),112)).getchannel("A").getbbox() for i in range(4)); assert im.getpixel((0,0))[3]==0; print("Theodore 4-view bald-glasses, no fixed helmet/backpack fitting guide available")'
          test -s _site/master-parts.js
          test -s _site/pixel-editor.css
          test -s _site/pixel-editor.js
          test -s _site/pixel-edit-core.js
          test ! -e _site/rig-studio.js
          python -c 'import json,pathlib; from PIL import Image; root=pathlib.Path("assets"); cs={c["id"]:c for c in json.load(open("_site/catalog.json"))["characters"]}; assert "legacy_otis" not in cs and "otis" not in cs, "Otis must not appear in active Character Stock"; t=cs["legacy_theodore"]; assert t["asset_status"]=="generated_preview" and t["rig_ready_count"]>=7; assert (pathlib.Path("_site")/t["sheet"]).is_file(); dirs=("se","sw","ne","nw"); assert all((root/"npc_theodore"/"frames"/f"theodore_{d}_idle_f0.png").is_file() for d in dirs), "Theodore source must retain all four original directions"; assert Image.open(root/"npc_theodore"/"frames"/"theodore_se_idle_f0.png").size==(64,112); assert (root/"npc_otis"/"frames"/"otis_se_idle_f0.png").exists(), "Archived Otis source remains preserved"; print("Otis retired from catalog; Theodore native 4-view sprites intact; Otis source archived")'
          test -s _site/animations.js
          test -s _site/rig-runtime.js
          test -s _site/shared-bone-runtime.js
          test -s _site/category-skeletons.json
          test -s _site/shared-bone-motions.json
          test ! -e _site/rig-studio.js
          python -c 'import json; from pathlib import Path; p=Path("_site"); cats=json.loads((p/"category-skeletons.json").read_text()); m=json.loads((p/"shared-bone-motions.json").read_text()); cs=json.loads((p/"catalog.json").read_text())["characters"]; ids={x["id"] for x in m["clips"]}; assert set(cats["types"])=={"HUMANOID","MASCOT","ALIEN_SUIT","HELMETED"}; assert len(ids)==7; assert all(x["skeleton_profile"] in cats["types"] and set(x["bone_actions"])==ids and not x["bone_skin_ready"] for x in cs); print("Validated",len(cs),"actor skeleton assignments and",len(ids),"shared canonical actions")'
          test -s _site/rigs.json
          test -s _site/animations.json
          test -s _site/animations.js
          python -m json.tool _site/catalog.json > /dev/null
          python -c 'import json,pathlib; s=pathlib.Path("_site"); rigs=json.loads((s/"rigs.json").read_text()); cs=json.loads((s/"catalog.json").read_text())["characters"]; assert len(rigs["types"])==4 and len(rigs["characters"])==len(cs) and len(rigs["registry"])==203; assert all(c["model_type"] in {"HUMANOID","MASCOT","ALIEN_SUIT","HELMETED"} for c in cs); assert all((s/c["motion_pack"]).is_file() for c in cs); assert all((s/x["atlas"]).is_file() for c in cs for x in json.loads((s/c["motion_pack"]).read_text())["clips"]); assert {c["model_type"] for c in cs}=={"HUMANOID","MASCOT","ALIEN_SUIT","HELMETED"}; assert sum(c["rig_ready_count"] for c in cs)>50; print("Verified",len(cs),"source-authored rig packs across",len(rigs["types"]),"model types")'
          python -c 'import json, pathlib; cs=json.load(open("_site/catalog.json"))["characters"]; assert cs; assert len(cs)>=32; assert not any(c["id"] in {"legacy_cosmo","legacy_rocketta","legacy_sol","legacy_zib","legacy_klank","legacy_nebi"} for c in cs); assert all("motions" in c for c in cs); assert all(any(m["id"]=="walk" and m["available"] for m in c["motions"]) for c in cs if c.get("asset_status")!="source_only" and c.get("origin") is None); assert all(pathlib.Path("_site",e["overlay"]).is_file() for c in cs for e in c["expressions"] if e.get("overlay")); print("Validated",len(cs),"character rigs, animated expression layers and motion bindings")'
          python -c 'import json,pathlib; from PIL import Image; cs=json.load(open("_site/catalog.json"))["characters"]; ids={c["id"]:c for c in cs}; names=("gfunk","theodore","yerbies"); assert all(len(ids["legacy_"+n]["expressions"])==5 for n in names); assert all(all((pathlib.Path("_site")/f["sheet"]).is_file() and (pathlib.Path("_site")/f["portrait"]).is_file() for f in ids["legacy_"+n]["expressions"]) for n in names); assert all(all(Image.open(pathlib.Path("_site")/f["sheet"]).size == (768,448) for f in ids["legacy_"+n]["expressions"]) for n in names); print("Verified",len(names),"legacy actors with 5 original, animated 4-view face atlases each")'
          python -m json.tool _site/animations.json > /dev/null
          python -c 'import json; r=json.load(open("assets/animation_library/actions.json")); a=r["actions"]; p=[x for x in a if x.get("status")=="planned"]; assert len(a)==203 and len(p)==196; assert all(x["frames"]==0 and x["frame_ms"]==[] and x["needs_rig"] for x in p); print("Validated",len(a),"central motion definitions, including",len(p),"unrendered life-sim plans")'
          python -c 'import json; xs=json.load(open("_site/animations.json"))["animations"]; p=[x for x in xs if x["status"]=="planned"]; assert len(p)==196; assert sum(x["priority"]=="P0" for x in p)==55; assert all(not x["gif"] and not x["poster"] and not x["template_json"] and x["rig_ready"] is False for x in p); assert all(x["phases"][0]=="enter" and x["phases"][-1]=="exit" for x in p); print("Verified",len(p),"non-playable life-sim animation specs")'
          python -c 'import json; d=json.load(open("_site/catalog.json")); assert d["characters"], "no characters found"; assert all(__import__("pathlib").Path("_site", c["walk"]).is_file() for c in d["characters"] if c.get("walk")); print("Validated", len(d["characters"]), "character(s)")'
          python -c 'import json, pathlib; d=json.load(open("_site/animations.json")); a=d["animations"]; assert len(a)>=10; assert sum(bool(x["gif"]) for x in a)>=7; assert all(not x["gif"] for x in a if x["status"]=="template"); assert all(pathlib.Path("_site", x["gif"]).is_file() for x in a if x["gif"]); print("Validated", len(a), "animation records")'
      - name: Upload preview build
        uses: actions/upload-artifact@v4
        with:
          name: character-stock-static-site
          path: _site/
          retention-days: 7

  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Never regenerate the heavy archive a second time. Publish the exact
      # same validated build output that passed catalog and animation audits.
      - name: Download verified character/animation catalog
        uses: actions/download-artifact@v4
        with:
          name: character-stock-static-site
          path: _site
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site/
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
