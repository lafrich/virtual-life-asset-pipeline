name: Native Mahluk Stock — Review Build

on:
  push:
    branches:
      - preview/mahluk-native-stock-2026-11-08
    paths:
      - tools/build_native_mahluk_stock.py
      - tools/preview_native_mahluk_stock.py
      - site/v6p-clip-store.js
      - site/mahluk-animation-studio.js
      - site/v6p-asset-gallery.js
      - tests/test_v6p_clip_store.cjs
      - .github/workflows/native-mahluk-stock-review.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  native-pixel-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout native V6P assets
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PIL and NumPy
        run: python -m pip install Pillow numpy
      - name: Test canonical stock database and activity contract
        run: |
          node tests/test_v6p_clip_store.cjs
          node tests/test_v6p_activity_contract.cjs
      - name: Compile real game character layers to preview bands
        run: python tools/build_native_mahluk_stock.py --out build/native-mahluk-stock-review
      - name: Compose genuine character previews
        run: python tools/preview_native_mahluk_stock.py
      - name: Verify original existing pushup pixel rows remain exact
        shell: bash
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          import numpy as np
          a=Path('build/native-mahluk-stock-review')
          parts=[p for p in a.rglob('*.png') if p.name != 'review_contact_sheet.png']
          assert len(parts)>=14, f'Not enough native part sheets: {len(parts)}'
          for p in parts:
              origin=Path('site/media/v6p-act')/p.relative_to(a)
              before=np.asarray(Image.open(origin).convert('RGBA'))[:112*8]
              after=np.asarray(Image.open(p).convert('RGBA'))[:112*8]
              assert np.array_equal(before,after), p
          assert (a/'review_contact_sheet.png').is_file()
          print('PASSED: original pushup/squat rows untouched; original native keys used; preview output generated')
          PY
      - name: Upload authentic character reference previews
        uses: actions/upload-artifact@v4
        with:
          name: mahluk-native-activity-review
          path: build/native-mahluk-stock-review/
          retention-days: 14
      - name: Commit review exports ONLY to the preview branch
        shell: bash
        run: |
          mkdir -p assets/mahluk_native_stock_review
          cp build/native-mahluk-stock-review/review_contact_sheet.png assets/mahluk_native_stock_review/
          cp build/native-mahluk-stock-review/NATIVE_STOCK_REVIEW.json assets/mahluk_native_stock_review/
          python - <<'PY'
          from pathlib import Path
          import shutil,json
          build=Path('build/native-mahluk-stock-review')
          root=Path('site/media/v6p-act')
          count=0
          for src in build.rglob('*.png'):
              if src.name=='review_contact_sheet.png': continue
              out=root/src.relative_to(build)
              out.parent.mkdir(parents=True,exist_ok=True)
              shutil.copyfile(src,out)
              count+=1
          meta=root/'READINESS.json'
          obj=json.loads(meta.read_text())
          for action in ['yoga_sphinx_idle','yoga_puppy_idle','hip_shake','yoga_happy_baby_idle']:
              obj['bands'][action]['status']='review_artwork'
              obj['bands'][action]['note']='Real V6P keyed part-sheet review frames; not visually approved; game playback disabled'
          for part in obj['parts'].values():
              part['other_bands']='review_artwork_not_approved'
          import hashlib
          hashfile=root/'HASH_MANIFEST.json'
          hashes=json.loads(hashfile.read_text())
          from PIL import Image
          import numpy as np
          for file in root.rglob('*.png'):
              rel=file.relative_to(root).as_posix()
              if rel not in hashes['outputs']:continue
              digest=hashlib.sha256(file.read_bytes()).hexdigest()
              im=Image.open(file).convert('RGBA')
              v=np.asarray(im)
              out=hashes['outputs'][rel]
              out['sha256']=digest;out['bytes']=file.stat().st_size
              out['size']=list(im.size);out['mode']='RGBA'
              if im.size==[384,2688] or im.size==(384,2688):
                  out['reserved_opaque_pixels']=int(np.count_nonzero(v[8*112:,:,3]))
                  colors=np.unique(v[v[:,:,3]>0],axis=0)
                  out['unique_opaque_colors']=colors.tolist()
              if rel in obj['parts']:obj['parts'][rel]['sha256']=digest
          meta.write_text(json.dumps(obj,indent=2,ensure_ascii=False)+'\\n')
          hashfile.write_text(json.dumps(hashes,indent=2,ensure_ascii=False)+'\\n')
          print('STAGED native keyed activity layers:',count)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/mahluk_native_stock_review/NATIVE_STOCK_REVIEW.json
          git add -f assets/mahluk_native_stock_review/review_contact_sheet.png
          git add -f site/media/v6p-act
          git add site/media/v6p-act/READINESS.json
          git add site/media/v6p-act/HASH_MANIFEST.json
          if ! git diff --cached --quiet; then
            git commit -m 'review: native character stock contact sheet [skip ci]'
            git push origin HEAD:preview/mahluk-native-stock-2026-11-08
          fi
