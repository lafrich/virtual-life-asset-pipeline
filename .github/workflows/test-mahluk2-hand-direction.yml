name: Mahluk 2 — Front/Rear Hand Alignment

on:
  push:
    branches: [main]
    paths:
      - "tools/build_original_rig_layers.py"
      - "tests/test_mahluk2_hand_direction_mapping.py"
      - "tests/test_native_rig_partition.py"
      - "site/mahluk-2/view-projection.js"
      - ".github/workflows/test-mahluk2-hand-direction.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arm-anatomy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install same native raster libraries as character pipeline
        run: python -m pip install -r requirements.txt
      - name: Verify four-view anatomical hand ownership and exact source pixels
        run: |
          python -m py_compile tools/build_original_rig_layers.py
          python -m unittest discover -s tests -p test_mahluk2_hand_direction_mapping.py -v
          python -m unittest discover -s tests -p test_native_rig_partition.py -v
      - name: Verify model projection and hand rig nodes
        run: |
          node --test tests/test_mahluk2_orbit_depth.cjs
          node --test tests/test_mahluk2_rig_rules.cjs
