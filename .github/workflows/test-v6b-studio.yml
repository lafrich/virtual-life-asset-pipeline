name: V6B Generator Studio — Verify

on:
  push:
    branches:
      - feature/v6b-generator-studio-app
    paths:
      - "apps/v6b_studio/**"
      - ".github/workflows/test-v6b-studio.yml"
      - "chars-iso/v6b/tools/live_v6b.py"
      - "chars-iso/v6b/live/chars/**"
  pull_request:
    paths:
      - "apps/v6b_studio/**"
      - ".github/workflows/test-v6b-studio.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install V6B dependencies
        run: python -m pip install -r requirements.txt
      - name: Check JavaScript and Python
        run: |
          node --check apps/v6b_studio/app.js
          python -m py_compile apps/v6b_studio/server.py apps/v6b_studio/test_server.py
      - name: Generate and verify original V6B output
        run: python -m unittest discover -s apps/v6b_studio -p 'test_*.py' -v
