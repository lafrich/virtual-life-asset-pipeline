name: V6B Sleep Neck Attachment — Fast Regression

on:
  push:
    branches: [main]
    paths:
      - "chars-iso/v6b/tools/live_v6b.py"
      - "tests/test_sleep_head_preservation.py"
      - ".github/workflows/test-sleep-neck.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  neck-attachment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - name: Check original head silhouette and connected horizontal neck across 4 views
        run: |
          python -m py_compile chars-iso/v6b/tools/live_v6b.py
          python -m unittest discover -s tests -p "test_sleep_head_preservation.py" -v
