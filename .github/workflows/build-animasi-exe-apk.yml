name: Build standalone Animasi.exe Android APK
on:
  push:
    branches:
      - build/animasi-exe-apk-20261108
    paths:
      - build/animasi-exe-apk-20261108/source.b64
      - .github/workflows/build-animasi-exe-apk.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout isolated build branch
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK tools
        uses: android-actions/setup-android@v3
      - name: Android API 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Restore Android Studio project
        run: |
          mkdir -p "$RUNNER_TEMP/animasi-apk"
          base64 --decode build/animasi-exe-apk-20261108/source.b64 > "$RUNNER_TEMP/animasi-apk/source.zip"
          unzip -q "$RUNNER_TEMP/animasi-apk/source.zip" -d "$RUNNER_TEMP/animasi-apk"
          test -f "$RUNNER_TEMP/animasi-apk/android-project/app/build.gradle"
      - name: Compile Android APK (debug signed)
        working-directory: ${{ runner.temp }}/animasi-apk/android-project
        run: gradle --no-daemon --stacktrace --console=plain :app:assembleDebug
      - name: Copy APK
        run: |
          mkdir -p build/animasi-exe-apk-20261108/out
          cp "$RUNNER_TEMP/animasi-apk/android-project/app/build/outputs/apk/debug/app-debug.apk" build/animasi-exe-apk-20261108/out/ANIMASI-EXE-Android-v2.1.apk
          unzip -t build/animasi-exe-apk-20261108/out/ANIMASI-EXE-Android-v2.1.apk | tail -1
      - name: Publish APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: animasi-exe-android-v2-1-apk
          path: build/animasi-exe-apk-20261108/out/ANIMASI-EXE-Android-v2.1.apk
          if-no-files-found: error
          retention-days: 30
