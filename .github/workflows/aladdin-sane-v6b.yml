name: Verify and build Aladdin Sane v6b NPC

on:
  push:
    branches:
      - feature/aladdin-sane-v6b
  workflow_dispatch:

concurrency:
  group: aladdin-sane-v6b-character-stock
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-dejavu-core fonts-wine
          python -m pip install -r requirements.txt
      - name: Verify baseline pipeline
        run: bash ./run_all.sh verify
      - name: Generate native game-ready character and previews
        run: python assets/npc_aladdin_sane/src/make_aladdin_sane.py
      - name: Audit sprite pixels
        run: python tools/audit_colors.py assets/npc_aladdin_sane/sprites
      - name: Store character sprite sheets and GIF permanently in GitHub
        if: success() && github.ref == 'refs/heads/feature/aladdin-sane-v6b'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The repo ignores build output by default. Force-add this one
          # reviewed character's game-ready binary assets to version control.
          git add -f assets/npc_aladdin_sane/sprites/*.png
          git add -f assets/npc_aladdin_sane/preview/*.png assets/npc_aladdin_sane/preview/*.gif
          git add -f assets/npc_aladdin_sane/manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "Store v6b Aladdin Sane sprites and walking previews [skip ci]"
            # Baseline verify regenerates tracked outputs elsewhere. Discard
            # those *unstaged* runner-only changes before rebase, without
            # touching the newly committed character files.
            git reset --hard HEAD
            # The branch can move while jobs are running; replay on latest
            # head before a non-forced push, preserving all other changes.
            for attempt in 1 2 3; do
              git fetch origin feature/aladdin-sane-v6b
              git rebase origin/feature/aladdin-sane-v6b
              if git push origin HEAD:feature/aladdin-sane-v6b; then
                break
              fi
              if [ "$attempt" = 3 ]; then
                echo "Push failed after three attempts" >&2
                exit 1
              fi
            done
          fi
      - name: Publish generated output for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aladdin-sane-v6b-generated
          path: |
            assets/npc_aladdin_sane/sprites/
            assets/npc_aladdin_sane/preview/
            assets/npc_aladdin_sane/manifest.json
          if-no-files-found: warn
