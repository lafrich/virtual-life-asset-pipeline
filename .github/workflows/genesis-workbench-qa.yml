      - 'site/genesis-cloud.js'
      - 'site/genesis_procedural_runtime.py'
      - 'site/mahluk-hidup.html'
      - 'site/lafrich-puppet-studio.html'
      - 'site/genesis-editor.html'
      - 'site/mahluk-action-editor.html'
      - 'site/mahluk-animation-native.html'
      - 'site/v6p-studio.html'
      - 'site/pixel-editor.html'
      - 'site/lgr1-raster.js'
      - 'site/lgr1-motion.js'
      - 'site/media/lgr1/**'
      - 'site/lafrich-puppet-core.js'
      - 'site/lafrich-puppet-renderer.js'
      - 'site/pixel-editor.js'
      - 'site/cloud-first-mahluk-entry.js'
      - 'tools/build_mahluk_motion_registry.py'
      - 'docs/LGR_FORMAT_SPEC.md'
      - 'site/mahluk-hub-drive.js'
      - 'site/drive-sync.js'
      - 'site/vlhub-characters-publish.js'
      - 'site/v6p-compositor.js'
      - 'tests/test_lgr_retirement.cjs'
      - 'tests/test_lgr_cloud_safety.cjs'
      - 'tests/test_genesis_procedural_runtime.py'
      - 'tests/test_lgr1_parity.py'
      - 'tests/test_lgr1_motion.cjs'
      - 'tests/test_lafrich_puppet.cjs'
      - 'tests/lgr1_raster_cli.cjs'
      - 'tests/fixtures/lgr1_male_bound.json'
      - '.github/workflows/genesis-workbench-qa.yml'
  pull_request:
    paths:
      - 'site/genesis-workbench.*'
      - 'site/genesis-base*'
      - 'site/mahluk-hidup-shell.js'
      - 'site/emosi-bridge.js'
      - 'tests/test_genesis_base.cjs'
      - 'site/genesis-cloud.js'
      - 'site/genesis_procedural_runtime.py'
      - 'site/mahluk-hidup.html'
      - 'site/lafrich-puppet-studio.html'
      - 'site/genesis-editor.html'
      - 'site/mahluk-action-editor.html'
      - 'site/mahluk-animation-native.html'
      - 'site/v6p-studio.html'
      - 'site/pixel-editor.html'
      - 'site/lgr1-raster.js'
      - 'site/lgr1-motion.js'
      - 'site/media/lgr1/**'
      - 'site/lafrich-puppet-core.js'
      - 'site/lafrich-puppet-renderer.js'
      - 'site/pixel-editor.js'
      - 'site/cloud-first-mahluk-entry.js'
      - 'tools/build_mahluk_motion_registry.py'
      - 'docs/LGR_FORMAT_SPEC.md'
      - 'site/mahluk-hub-drive.js'
      - 'site/drive-sync.js'
      - 'site/vlhub-characters-publish.js'
      - 'site/v6p-compositor.js'
      - 'tests/test_lgr_retirement.cjs'
      - 'tests/test_lgr_cloud_safety.cjs'
      - 'tests/test_genesis_procedural_runtime.py'
      - 'tests/test_lgr1_parity.py'
      - 'tests/test_lgr1_motion.cjs'
      - 'tests/test_lafrich_puppet.cjs'
      - 'tests/lgr1_raster_cli.cjs'
      - 'tests/fixtures/lgr1_male_bound.json'
jobs:
  syntax-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          node --check site/genesis-base-app.js
          node --check site/genesis-base.js
          node --check site/mahluk-hidup-shell.js
          node tests/test_genesis_base.cjs
          node --check site/genesis-cloud.js
          node --check site/lafrich-puppet-core.js
          node --check site/lafrich-puppet-renderer.js
          node --check site/lgr1-raster.js
          node --check site/lgr1-motion.js
          node --test tests/test_lgr1_motion.cjs
          node --test tests/test_lafrich_puppet.cjs
          node --check site/mahluk-hub-drive.js
          node --check site/drive-sync.js
          node --check site/vlhub-characters-publish.js
          node --check site/v6p-compositor.js
          node tests/test_lgr_retirement.cjs
          node tests/test_lgr_cloud_safety.cjs
      - name: HTML / UI integration contract
        run: |
          node <<'NODE'
          const fs=require('fs'),assert=require('assert');
          const html=fs.readFileSync('site/genesis-base.html','utf8');
          const script=fs.readFileSync('site/genesis-base-app.js','utf8')+fs.readFileSync('site/genesis-base.js','utf8');
          const ids=[...html.matchAll(/\bid="([^"]+)"/g)].map(m=>m[1]);
          const missing=[...script.matchAll(/\$\("([^"]+)"\)/g)].map(m=>m[1])
            .filter(id=>!ids.includes(id));
          assert.deepStrictEqual(missing,[], 'Missing DOM controls: '+missing.join(', '));
          assert.strictEqual(ids.length,new Set(ids).size,'Duplicate HTML IDs');
          for(const id of ['pixelApply','pixelCanvas','pixelDirection','seed','reslice-head','rig-motion-play','gb-export','gb-import','gb-save-drive'])
            assert(ids.includes(id),'Missing required control '+id);
          assert(html.includes('./genesis-cloud.js'),'Dedicated Drive module not loaded');
          assert(!html.includes('./mahluk-hub.js'),'Legacy workspace accidentally active');
          assert(!html.includes('./lafrich-puppet-studio.js'),'Legacy character/animation app accidentally active');
          const shell=fs.readFileSync('site/genesis-workbench.html','utf8'),shellJs=fs.readFileSync('site/mahluk-hidup-shell.js','utf8');
          const sids=[...shell.matchAll(/\bid="([^"]+)"/g)].map(m=>m[1]);
          const smissing=[...shellJs.matchAll(/\$\("([^"]+)"\)/g)].map(m=>m[1]).filter(id=>!sids.includes(id));
          assert.deepStrictEqual(smissing,[],'Shell missing DOM: '+smissing.join(', '));
          console.log('Genesis Base + Mahluk Hidup shell UI contracts: OK');
          NODE
      - name: Python continuous rig tests
        run: |
          python3 -m pip install --quiet pillow
          python3 -m py_compile site/genesis_procedural_runtime.py
          python3 -m unittest discover -s tests -p 'test_genesis_procedural_runtime.py' -v
          python3 -m unittest discover -s tests -p 'test_lgr1_parity.py' -v

  browser-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Chromium browser harness
        run: |
          npm install --prefix /tmp/genesis-qa --no-save playwright@1.56.1
          npx --yes --prefix /tmp/genesis-qa playwright install chromium
      - name: Launch local static test + real browser
        env:
          NODE_PATH: /tmp/genesis-qa/node_modules
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/genesis-http.log 2>&1 &
          sleep 1
          node <<'NODE'
          (async()=>{
            const {chromium}=require('playwright'),assert=require('assert'),fs=require('fs');
            const B='http://127.0.0.1:8765/site/';
            const browser=await chromium.launch({headless:true});
            const ctx=await browser.newContext({viewport:{width:1500,height:1000},acceptDownloads:true});
            const page=await ctx.newPage(),errors=[];
            page.on('dialog',d=>d.accept());page.on('pageerror',e=>errors.push(e.message));
            await page.goto(B+'genesis-base.html');
            await page.locator('#viewdetail').filter({hasText:'MALE'}).waitFor({timeout:90000});
            const vis=await page.evaluate(()=>[...document.querySelectorAll('#progress button')].filter(b=>b.offsetParent).map(b=>b.dataset.step));
            assert.deepStrictEqual(vis,['pixel','rig']);
            await page.locator('#edit-pixels').click();await page.locator('#pixelOverlay').waitFor({state:'visible'});
            await page.locator('#pixelClose').click();
            await page.locator('#pixel-next').click();
            await page.locator('#rig-motion-play').click();await page.waitForTimeout(500);
            const [dl]=await Promise.all([page.waitForEvent('download'),page.locator('#gb-export').click()]);
            const f='/tmp/'+dl.suggestedFilename();await dl.saveAs(f);
            const pkg=JSON.parse(fs.readFileSync(f,'utf8'));
            assert.strictEqual(pkg.format,'lafrich-genesis-base-v1');assert.strictEqual(pkg.parts.length,11);
            await page.locator('#gender').selectOption('female');
            await page.locator('#viewdetail').filter({hasText:'FEMALE'}).waitFor({timeout:60000});
            await page.locator('#gb-file').setInputFiles(f);
            await page.waitForFunction(()=>/IMPORTED/.test(document.querySelector('#statusmsg').textContent),null,{timeout:30000});
            assert.strictEqual(await page.locator('#gender').inputValue(),'male');
            const shell=await ctx.newPage();shell.on('pageerror',e=>errors.push('shell '+e.message));
            await shell.goto(B+'genesis-workbench.html?tab=lgr');
            await shell.locator('#face-count').filter({hasText:'Emosi faces'}).waitFor({timeout:30000});
            assert.strictEqual(await shell.locator('#open-genesis-base').getAttribute('href'),'./genesis-base.html');
            assert.deepStrictEqual(errors,[]);
            console.log('Genesis Base + Mahluk Hidup shell browser smoke: OK');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
