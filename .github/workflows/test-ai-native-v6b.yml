name: Native AI V6B Renderer — Smoke Test

on:
  push:
    branches: [main]
    paths:
      - "tools/generate_npc_from_spec.py"
      - "tests/test_ai_native_build.py"
      - ".github/workflows/test-ai-native-v6b.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-draft-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Render original 44-row V6B sheet into temporary folder
        run: python -m unittest discover -s tests -p 'test_ai_native_build.py' -v
