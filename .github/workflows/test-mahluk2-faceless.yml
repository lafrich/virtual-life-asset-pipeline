name: Mahluk 2 — Faceless Nude V6B & Storage Integration
on:
  push:
    branches: [main]
    paths:
      - 'site/mahluk-2/index.html'
      - 'site/mahluk-2/studio.js'
      - 'site/mahluk-2/studio.css'
      - 'site/mahluk-2/faceless-bases.js'
      - 'site/action-editor.js'
      - 'tests/test_mahluk2_faceless_bases.cjs'
      - 'tests/test_mahluk2_faceless_bases.browser.cjs'
      - '.github/workflows/test-mahluk2-faceless.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify canonical male/female V6B roots and existing editor
        run: |
          node --check site/mahluk-2/faceless-bases.js
          node --check site/mahluk-2/studio.js
          node --check site/action-editor.js
          node --test tests/test_mahluk2_faceless_bases.cjs
          node --test tests/test_mahluk2_emotion_planes.cjs
          node --test tests/test_mahluk2_rig_rules.cjs
          node --test tests/test_mahluk2_clipboard.cjs
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
        with:
          path: virtual-life-asset-pipeline
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser tests
        run: npm install --no-save playwright@1.56.1 pngjs@7.0.0
      - name: Serve Mahluk 2 locally
        run: python3 -m http.server 8099 --bind 127.0.0.1 >/tmp/mahluk-faceless-http.log 2>&1 &
      - name: Test Install Both, Pixel Editor, saved roots, and Emosi.exe attachment
        run: node virtual-life-asset-pipeline/tests/test_mahluk2_faceless_bases.browser.cjs
