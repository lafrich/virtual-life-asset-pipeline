name: AI Character — Native V6B Draft Review

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "8-32 lowercase letters/digits; used only to name the review branch"
        required: true
        type: string
      character_spec:
        description: "Restricted V6B character JSON from authenticated AI backend"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ai-native-draft-${{ inputs.request_id }}
  cancel-in-progress: false

jobs:
  native_v6b_draft:
    runs-on: ubuntu-latest
    env:
      REQUEST_ID: ${{ inputs.request_id }}
      V6B_SPEC_JSON: ${{ inputs.character_spec }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install native V6B runtime
        run: python -m pip install -r requirements.txt
      - name: Validate request ID
        shell: bash
        run: |
          if [[ ! "$REQUEST_ID" =~ ^[a-z0-9]{8,32}$ ]]; then
            echo "Invalid request ID" >&2
            exit 1
          fi
          python - <<'PY'
          import os,json
          from pathlib import Path
          import sys
          sys.path.insert(0,"tools")
          from generate_npc_from_spec import validate
          spec=validate(json.loads(os.environ["V6B_SPEC_JSON"]))
          p=Path("assets")/("npc_"+spec["id"])
          if p.exists(): raise SystemExit("Refusing to overwrite an existing character")
          print("Valid native V6B spec:", spec["id"])
          PY
      - name: Create draft branch and native 44-row character sheet
        shell: bash
        run: |
          git switch -c "ai-character/$REQUEST_ID"
          python tools/generate_npc_from_spec.py --env
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import json,os
          a=json.loads(os.environ["V6B_SPEC_JSON"])
          folder=Path("assets")/("npc_"+a["id"])
          manifest=json.loads((folder/"manifest.json").read_text())
          assert manifest["engine"]=="virtual-life-v6b"
          with Image.open(folder/manifest["sheet"]) as im:
              assert im.mode=="RGBA" and im.size==(384,4928)
          with Image.open(folder/manifest["previews"][0]) as im:
              assert im.n_frames>=24
          print("Native 4-direction 6-frame walk + 44-row animation sheet checked")
          PY
      - name: Publish preview artifact for review
        uses: actions/upload-artifact@v4
        with:
          name: v6b-draft-${{ inputs.request_id }}
          path: assets/npc_ai_*/
          retention-days: 14
      - name: Open review pull request
        shell: bash
        run: |
          git config user.name "mahluk-hidup-draft-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/npc_ai_*/
          git commit -m "Draft native V6B character for review ($REQUEST_ID)"
          git push --set-upstream origin "ai-character/$REQUEST_ID"
          cat > /tmp/review.md <<'EOF'
          ## Native Mahluk Hidup V6B character / REVIEW REQUIRED

          - Generated using existing npc_v6b.py and V6B body/face/pose layers.
          - Uses the real original 384 x 4928 sprite sheet, 64 x 112 frame grid.
          - Includes 4-way walk preview, expression overlays, and other original pose rows.
          - **Do not merge until visual inspection** of side/back views, limbs, hair, face, clothing and pose alignment.
          - The first-pass generator uses constrained V6B components. Unusual reference details need hand-authored layer edits just like Aladdin Sane.
          - Source photos are not written to GitHub; this PR contains only validated character configuration and generated assets.
          - Merge this PR to publish the approved character in Character Stock. Semesta integration is a separate selection step.

          This PR is deliberately not auto-merged.
          EOF
          if gh pr create --base main --head "ai-character/$REQUEST_ID" --title "Review native V6B character ($REQUEST_ID)" --body-file /tmp/review.md; then
            echo "Review PR created."
          else
            echo "::warning::Draft branch pushed but PR creation was blocked. Check repository Actions settings > General > Workflow permissions > Allow GitHub Actions to create and approve pull requests."
          fi
