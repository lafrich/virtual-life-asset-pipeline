name: Genesis Native Animation — Renderer and Import QA
on:
  push:
    branches: [main]
    paths:
      - "site/genesis-native-*.js"
      - "site/genesis-native-render.py"
      - "site/mahluk-animation-native.*"
      - "tests/test_genesis_native_*"
      - "chars-iso/v6b/tools/live_v6b.py"
      - ".github/workflows/genesis-native-animation-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install numpy pillow
      - name: Native V6B original pixel renderer
        run: |
          python -m py_compile site/genesis-native-render.py
          python tests/test_genesis_native_renderer.py
      - name: Interchange contract, editor and Worker syntax
        run: |
          node --check site/genesis-native-python-contract.js
          node --check site/genesis-native-worker.js
          node --check site/mahluk-animation-native.js
          node tests/test_genesis_native_python_contract.cjs
          test -s site/mahluk-animation-native.html
  browser-native:
    needs: native-python
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser testing runtime
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.0
          npx playwright install chromium
      - name: Serve unmodified native reference data to browser worker
        run: |
          mkdir -p site/genesis-native-source/tools site/genesis-native-source/study site/genesis-native-source/live/chars
          cp chars-iso/v6b/tools/live_v6b.py site/genesis-native-source/tools/
          cp chars-iso/v6b/study/ref_*.npy site/genesis-native-source/study/
          cp chars-iso/v6b/live/chars/{ichsan,noor}.json site/genesis-native-source/live/chars/
          python3 -m http.server 4173 --bind 127.0.0.1 -d site >/tmp/genesis-native-http.log 2>&1 &
          sleep 1
          node tests/smoke_genesis_native_animation.cjs
