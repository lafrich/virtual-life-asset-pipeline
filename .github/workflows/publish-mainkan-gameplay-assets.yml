name: Publish Mainkan V6B r4 gameplay fixture sprites
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'assets/street_buildings/mainkan_gameplay_payload/**'
      - 'assets/street_buildings/mainkan_gameplay_catalog.json'
      - 'tools/publish_mainkan_gameplay_assets.py'
      - '.github/workflows/publish-mainkan-gameplay-assets.yml'
permissions:
  contents: write
concurrency:
  group: publish-mainkan-gameplay-v6b-r4
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PNG validator
        run: python -m pip install pillow
      - name: Decode, verify and publish native 1x sprites
        run: python tools/publish_mainkan_gameplay_assets.py
      - name: Commit verified sprites
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f assets/street_buildings/props/id_mainkan_*.png
          if ! git diff --cached --quiet; then
            git commit -m "Publish 120 native Mainkan V6B r4 gameplay fixture sprites [skip ci]"
            git push
          fi