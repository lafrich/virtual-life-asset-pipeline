name: Publish Mainkan V6B r4 gameplay fixture sprites
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'assets/street_buildings/mainkan_gameplay_payload/**'
      - 'assets/street_buildings/mainkan_gameplay_catalog.json'
      - 'tools/publish_mainkan_gameplay_assets.py'
      - '.github/workflows/publish-mainkan-gameplay-assets.yml'
permissions:
  contents: read
concurrency:
  group: publish-mainkan-gameplay-v6b-r4
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PNG validator
        run: python -m pip install pillow
      - name: Decode, verify and publish native 1x sprites
        run: python tools/publish_mainkan_gameplay_assets.py
      - name: Package generated changes for branch and PR review
        run: |
          git add -f assets/street_buildings/props/id_mainkan_*.png
          git diff --cached --name-only -z --diff-filter=ACMRT | tar --null --files-from=- -czf reviewed-assets.tar.gz
      - name: Upload reviewed asset candidate (no automatic publication)
        uses: actions/upload-artifact@v4
        with:
          name: reviewed-assets-${{ github.run_id }}
          path: reviewed-assets.tar.gz
          retention-days: 7
