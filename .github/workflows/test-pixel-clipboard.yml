name: Mahluk 2 — Pixel Clipboard Tests

on:
  push:
    branches: [main]
    paths:
      - "site/mahluk-2/pixel-selection.js"
      - "site/mahluk-2/plane-pixel-editor.js"
      - "site/mahluk-2/index.html"
      - "site/emotion-studio/index.html"
      - "site/mahluk-2/studio.css"
      - "tests/test_mahluk2_clipboard.cjs"
      - ".github/workflows/test-pixel-clipboard.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pixel-clipboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Pixel Editor source
        run: |
          node --check site/mahluk-2/pixel-selection.js
          node --check site/mahluk-2/plane-pixel-editor.js
      - name: Test selection, clipboard, mirrored paste, and existing controls
        run: |
          node --test tests/test_mahluk2_clipboard.cjs
          node --test tests/test_mahluk2_pixel_select_overlay.cjs
          node --test tests/test_mahluk2_pixel_editor.cjs
