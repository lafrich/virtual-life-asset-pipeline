name: Happy Baby Genesis — Preview Only

on:
  push:
    branches:
      - preview/genesis-happy-baby-20261108
    paths:
      - 'tools/render_happy_baby_review.py'
      - '.github/workflows/happy-baby-preview-only.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'tools/render_happy_baby_review.py'
      - '.github/workflows/happy-baby-preview-only.yml'

permissions:
  contents: write

jobs:
  render-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch (not main)
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: preview/genesis-happy-baby-20261108
      - name: Install Python and native-image dependencies
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pillow and NumPy
        run: python -m pip install Pillow numpy
      - name: Generate preview GIFs from checked-in Mahluk native sheets
        run: |
          python tools/render_happy_baby_review.py
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          r=Path('docs/previews/happy-baby-rocking')
          for f in r.glob('*.gif'):
              with Image.open(f) as im:
                  assert im.n_frames==6, (f,im.n_frames)
                  assert all(im.seek(i) is None and im.info.get('duration')==150 for i in range(6))
          assert len(list(r.glob('*.gif')))==9
          assert (r/'six_frame_review.png').is_file()
          print('Verified 9 preview GIFs, one keyframe contact sheet, no animation stock files generated.')
          PY
      - name: Push preview media to preview branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Repo globally ignores generated PNG/GIF: force-stage preview media only.
          git add docs/previews/happy-baby-rocking/README.json
          git add -f docs/previews/happy-baby-rocking/*.gif docs/previews/happy-baby-rocking/*.png
          if ! git diff --cached --quiet; then
            git commit -m "Publish standalone Happy Baby Genesis preview media [preview-generated]"
            git push origin HEAD:preview/genesis-happy-baby-20261108
          fi
