name: Non-destructive Mahluk Cloud Startup
on:
  push:
    branches: [feature/nondestructive-cloud-entry-20261108]
  workflow_dispatch:
jobs:
  safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cloud-first Mahluk startup and import safety
        run: node --test tests/cloud-first-mahluk-entry.test.cjs tests/test_mahluk_unified_workspace.cjs
      - name: Check parse integrity of all new scripts
        run: |
          node --check site/cloud-first-mahluk-entry.js
          node --check site/cloud-first-universal.js
          node --check site/cloud-first-startup.js
  native-browser:
    needs: safety
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.0
          npx playwright install chromium
      - name: Test Drive native UI with simulated OAuth and Google Drive REST
        run: |
          mkdir -p /tmp/mahluk-cloud-root
          ln -s "$PWD/site" /tmp/mahluk-cloud-root/virtual-life-asset-pipeline
          python3 -m http.server 4173 --bind 127.0.0.1 -d /tmp/mahluk-cloud-root >/tmp/mahluk-cloud-server.log 2>&1 &
          node tests/smoke_mahluk_cloud_startup.cjs
