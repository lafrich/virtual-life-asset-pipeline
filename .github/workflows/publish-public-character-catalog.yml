name: Publish safe character previews to public catalog

on:
  push:
    branches:
      - main
      - feature/split-private-source-public-catalog
    paths:
      - "assets/**"
      - "site/**"
      - "tools/build_character_catalog.py"
      - "tools/audit_public_catalog.py"
      - ".github/workflows/publish-public-character-catalog.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-sanitized-character-catalog
  cancel-in-progress: true

jobs:
  build-public:
    runs-on: ubuntu-latest
    env:
      CATALOG_PUBLISH_TOKEN: ${{ secrets.CATALOG_PUBLISH_TOKEN }}
    steps:
      - name: Checkout private source (never published)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pillow
        run: python -m pip install Pillow
      - name: Build presentation-only catalog
        run: python tools/build_character_catalog.py --public
      - name: Block any raw source/master sprite leaks
        run: python tools/audit_public_catalog.py _public_site
      - name: Upload safe site test artifact
        uses: actions/upload-artifact@v4
        with:
          name: public-character-catalog-safe-preview
          path: _public_site/
          retention-days: 7

      # Never copy .git, GitHub Actions code, generator sources, full
      # 384x4928 sprite sheets, or manifests to the public destination.
      # A single fine-grained PAT must grant Contents: Read/Write on ONLY
      # lafrich/virtual-life-character-catalog, not this private repo.
      - name: Checkout public destination
        if: github.ref == 'refs/heads/main' && env.CATALOG_PUBLISH_TOKEN != ''
        uses: actions/checkout@v4
        with:
          repository: lafrich/virtual-life-character-catalog
          ref: main
          token: ${{ secrets.CATALOG_PUBLISH_TOKEN }}
          persist-credentials: true
          path: public-destination

      - name: Push presentation files to public Pages repo
        if: github.ref == 'refs/heads/main' && env.CATALOG_PUBLISH_TOKEN != ''
        run: |
          set -euo pipefail
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='README.md' \
            _public_site/ public-destination/
          cd public-destination
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Update Character Stock public previews [skip ci]'
            git push origin HEAD:main
          else
            echo "No public preview changes to publish."
          fi
      - name: Publishing configuration status
        if: github.ref == 'refs/heads/main' && env.CATALOG_PUBLISH_TOKEN == ''
        run: echo "Public preview export passed audit. Add CATALOG_PUBLISH_TOKEN secret after creating the public catalog repository to enable automatic publishing."
