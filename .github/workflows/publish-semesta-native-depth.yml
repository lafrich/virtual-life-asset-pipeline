name: Publish native sprite depth for Semesta
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-semesta-native-depth.yml"
      - "assets/street_buildings/_work/render_native_depth.py"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: semesta-street-native-depth
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install source renderer
        run: python -m pip install numpy pillow
      - name: Export and validate exact per-pixel surface depth
        run: python assets/street_buildings/_work/render_native_depth.py
      - name: Commit native pixel depth texture artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f assets/street_buildings/jalan_besar/*__depth.png assets/street_buildings/kampung/*__depth.png assets/street_buildings/pasar_loak/*__depth.png assets/street_buildings/gang/*__depth.png assets/street_buildings/props/*__depth.png assets/street_buildings/taman/*__depth.png assets/street_buildings/sinyal/*__depth.png
          if ! git diff --cached --quiet; then
            git commit -m "Publish native per-pixel street depth for Semesta [skip ci]"
            git push
          fi
