name: MAHLUK HIDUP — Unified Workspace Regression
on:
  push:
    branches:
      - main
      - feature/mahluk-unified-workspace-20261107
      - feature/character-animation-action-workflow-20261107
      - fix/character-draw-four-apply-animation-20261107
      - feature/mahluk-character-wizard-navigation-20261107
      - fix/mahluk-pixel-sprite-view-switch-20261108
      - fix/character-back-layers-and-readonly-gallery-20261108
      - fix/mahluk-nude-preview-stale-frames-20261108
    paths:
      - "site/mahluk-*.html"
      - "site/mahluk-*.js"
      - "site/v6p-character-*.js"
      - "site/v6p-pixel-source.js"
      - "site/pixel-editor.js"
      - "site/emotion-studio/shared-pixel-editor.js"
      - "site/v6p-compositor.js"
      - "site/v6p-studio.html"
      - "site/v6p-asset-gallery.js"
      - "site/pixel-editor.html"
      - "site/index.html"
      - "tests/test_mahluk_unified_workspace.cjs"
      - "tests/test_mahluk_character_animation_flow.cjs"
      - "tests/test_mahluk_character_retarget.cjs"
      - "tests/test_mahluk_character_wizard.cjs"
      - "tests/smoke_mahluk_character_wizard.cjs"
      - "tests/smoke_mahluk_pixel_angle.cjs"
      - "tests/test_mahluk_back_layer_gallery.cjs"
      - "tests/smoke_mahluk_back_gallery.cjs"
      - "tests/smoke_mahluk_custom_wear.cjs"
      - "tests/smoke_mahluk_action_animation_flows.cjs"
      - "tests/smoke_mahluk_native_stock_gallery.cjs"
      - "tests/smoke_mahluk_drive_backup_restore.cjs"
      - "tests/smoke_mahluk_character_quota.cjs"
      - "tests/test_mahluk_stock_gallery.cjs"
      - ".github/workflows/mahluk-unified-regression.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Parse all unified workspace JavaScript
        run: |
          node --check site/mahluk-hub.js
          node --check site/mahluk-hub-drive.js
          node --check site/mahluk-action-editor.js
          node --check site/mahluk-animation-studio.js
          node --check site/v6p-custom-wear.js
          node --check site/v6p-character-store.js
          node --check site/v6p-character-workflow.js
          node --check site/v6p-character-wizard.js
          node --check site/v6p-character-retarget.js
          node --check site/v6p-compositor.js
          node --check site/v6p-asset-gallery.js
          node --check site/pixel-editor.js
          node --check site/emotion-studio/shared-pixel-editor.js
      - name: Check preserved existing editors and new app shell
        run: |
          node --test tests/test_custom_wear_mapping.cjs tests/test_mahluk_unified_workspace.cjs tests/test_mahluk_character_animation_flow.cjs tests/test_mahluk_character_retarget.cjs tests/test_mahluk_character_wizard.cjs tests/test_mahluk_back_layer_gallery.cjs
          node tests/test_pixel_editor.cjs
          node tests/test_emotion_studio.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify approved native stock database and rejected motion exclusion
        run: |
          node tests/test_v6p_activity_contract.cjs
          node tests/test_v6p_clip_store.cjs
          node tests/test_mahluk_stock_gallery.cjs
          test ! -e site/mahluk-motion-library.html
          test ! -e assets/grok_motion_review/preview-00.zip
      - name: Confirm no Playwright or deployment from feature branch
        run: test -s site/mahluk-hidup.html && test -s site/v6p-studio.html && test -s site/pixel-editor.html

  wizard-browser-smoke:
    needs: regression
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser test tools
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.0
          npx playwright install chromium
      - name: Smoke test Character wizard step-by-step
        run: |
          mkdir -p /tmp/character-wizard-root
          ln -s "$PWD/site" /tmp/character-wizard-root/virtual-life-asset-pipeline
          python3 -m http.server 4173 --bind 127.0.0.1 -d /tmp/character-wizard-root >/tmp/character-wizard-server.log 2>&1 &
          node tests/smoke_mahluk_drive_backup_restore.cjs
          node tests/smoke_mahluk_character_quota.cjs
          node tests/smoke_mahluk_action_animation_flows.cjs
          node tests/smoke_mahluk_native_stock_gallery.cjs
          node tests/smoke_mahluk_custom_wear.cjs
          node tests/smoke_mahluk_custom_wear_roundtrip.cjs
          node tests/smoke_mahluk_character_wizard.cjs
          node tests/smoke_mahluk_pixel_angle.cjs
          node tests/smoke_mahluk_back_gallery.cjs
