name: Publish Kebon Sirih urban street textures
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-kebon-sirih.yml"
      - "assets/kebon_sirih/_work/render_terrain.py"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: semesta-kebon-sirih-tiles
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install native pixel renderer
        run: python -m pip install pillow
      - name: Render 1x street material textures
        run: python assets/kebon_sirih/_work/render_terrain.py
      - name: Validate texture sizes and RGBA
        run: |
          python - <<'PY'
          from PIL import Image
          import json,os
          m=json.load(open('assets/kebon_sirih/manifest.json'))
          assert len(m['tiles'])==13,len(m['tiles'])
          for k,spec in m['tiles'].items():
            p='assets/kebon_sirih/'+spec['file']
            assert os.path.isfile(p),p
            with Image.open(p) as im:
              assert im.size==(64,64) and im.mode=='RGBA',(k,im.size,im.mode)
              assert im.getpixel((0,0))[3]==255,k
          assert {'drain','river','road_asphalt','grass','water'}.issubset(m['tiles'])
          print('Validated',len(m['tiles']),'source-generated city terrain PNGs')
          PY
      - name: Publish PNG tiles and manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f assets/kebon_sirih/terrain/*.png
          git add assets/kebon_sirih/manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish Kebon Sirih Jakarta urban terrain textures [skip ci]"
            git push
          fi
