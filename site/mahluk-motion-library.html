<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MAHLUK HIDUP · Motion Database</title>
<style>
:root{--ink:#182d49;--line:#778da9}
*{box-sizing:border-box}
body{margin:0;padding:9px;background:#e2e5e9;color:var(--ink);font:12px Tahoma,Arial,sans-serif;min-height:100vh}
header{background:#1f4d94;color:white;padding:8px;font-weight:700;display:flex;justify-content:space-between;gap:8px}
h1{font-size:12px;margin:0}p{line-height:1.4}
#motion-status{padding:7px;background:#eef4ff;border:1px solid #8aadd9;margin:8px 0;font-size:10px}
#motion-status.err{background:#f8dbd8;color:#9e2424}
button,input,select{font:inherit;border:1px solid #818c9c;background:#fff;padding:6px;color:var(--ink)}
button{cursor:pointer;background:linear-gradient(#fff,#d9e2ed)}
button[aria-pressed=true]{background:#b9d5ff;border-color:#2864b3}
button:disabled{opacity:.4}
.toolbar{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0}
.toolbar input{min-width:125px;flex:1 1 140px}
#motion-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:5px;margin:6px 0 12px;max-height:30vh;overflow-y:auto;padding:4px;background:#d2d8e0}
.motion-item{text-align:left;display:flex;flex-direction:column;gap:4px;min-height:48px}
.motion-item strong{font-size:10px;text-overflow:ellipsis;overflow:hidden;white-space:nowrap}
.motion-item small{font-size:9px;color:#5a6571}
#motion-count{font-size:10px;margin-left:auto}
.preview{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;background:#f1f1ec;padding:8px;border:1px solid #9badbf}
#motion-canvas{width:min(100%,220px);height:auto;aspect-ratio:64/112;image-rendering:pixelated;display:block;margin:8px auto;background:repeating-conic-gradient(#d9e3ee 0 25%,#b8c7da 0 50%) 0 0/24px 24px;border:1px solid #6c88a6}
.direction{display:flex;flex-wrap:wrap;gap:5px}
.direction label{display:flex;flex-direction:column;gap:4px;flex:1}
.player{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.player input{width:100%}
#motion-detail,#motion-actor-note{font-size:10px;color:#4d5b6b}
#motion-actor-note{font-weight:bold}
#motion-copy{background:#d2e6fd;border-color:#3771b1}
footer{padding:6px;color:#5d6575;font-size:10px}
@media(max-width:600px){body{padding:5px}#motion-list{max-height:28dvh;grid-template-columns:repeat(2,minmax(0,1fr))}#motion-canvas{width:145px}}
</style></head><body>
<header><h1>ANIMATION DATABASE / GROK REVIEW</h1><span id="motion-count">0 ACTIONS</span></header>
<div id="motion-status" role="status">Loading original authored motion sheets…</div>
<div class="toolbar"><input id="motion-search" type="search" placeholder="Search action…">
<select id="motion-filter" aria-label="Filter motions"><option value="all">ALL</option><option value="authored">44 AUTHORED</option>
<option value="mobility">MOBILITY</option><option value="daily">DAILY</option><option value="hygiene">HYGIENE</option>
<option value="social">SOCIAL</option><option value="work">WORK</option><option value="yoga">YOGA</option></select></div>
<div id="motion-list" aria-label="Available 49 Grok review animations"></div>
<div class="preview">
 <div class="direction"><label>ACTOR<select id="motion-actor"><option value="ichsan">ICHSAN</option><option value="npc">MALE NPC</option></select></label>
 <label>VIEW<select id="motion-direction"><option value="se">SE</option><option value="sw">SW</option><option value="ne">NE</option><option value="nw">NW</option></select></label></div>
 <canvas id="motion-canvas" width="192" height="336" aria-label="Native 64 by 112 pixel animation frame"></canvas>
 <div class="player"><button id="motion-prev" type="button">◀</button><button id="motion-play" type="button" disabled>▶ PLAY</button><button id="motion-next" type="button">▶</button><span id="motion-frame-label">1 / 1</span></div>
 <input id="motion-frame" type="range" min="0" max="0" value="0" aria-label="Motion timeline frame">
 <div id="motion-actor-note">PENDING REVIEW · not installed in game</div>
 <p id="motion-detail"></p>
 <div class="player"><button id="motion-copy" type="button">✎ EDIT A COPY · PIXEL EDITOR</button><button id="motion-download" type="button" disabled>↓ NATIVE SHEET</button></div>
</div>
<footer>Grok v1 · 49 actions / 108 real native sheets · SE/SW/NE/NW · pivot (32,100). Source sheets are immutable. No automatic gameplay publishing.</footer>
<script src="./v6p-activity-contract.js?v=v6p-act-v2-20261107"></script>
<script src="./v6p-clip-store.js?v=v6p-act-v2-20261107"></script>
<script src="./v6p-grok-copy.js?v=mahluk-unified-1"></script>
<script src="./v6p-motion-review.js?v=mahluk-unified-1"></script>
<script>window.V6PMotionReview.mount();</script>
</body></html>
