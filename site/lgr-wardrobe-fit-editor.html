<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#194988">
<title>LGR · Wardrobe Fit — Genesis Pixel Editor</title>
<link rel="stylesheet" href="./mahluk-subapps.css?v=mh-sync-1">
<link rel="stylesheet" href="./mahluk-action-frame-pixel.css?v=genesis-workbench-v1">
<link rel="stylesheet" href="./mahluk-pakaian.css?v=wardrobe-reference-export-3">
<style>
html,body{height:100%;margin:0;background:#abc1dd;font:12px Tahoma,Arial,sans-serif}
*{box-sizing:border-box}
#root{height:100dvh;min-height:0;display:flex;flex-direction:column}
header{min-height:42px;background:linear-gradient(90deg,#0f357b,#4084cb);color:#fff;padding:8px 12px;display:flex;align-items:center;flex-wrap:wrap;gap:12px}
header strong{font-size:13px}header small{font-size:11px;opacity:.9}
header a{color:#fff;font-weight:700;margin-left:auto}
#pakaianpanel{flex:1;min-height:0;overflow:auto}
.pk-cover-controls{display:flex;align-items:flex-end;flex-wrap:wrap;gap:6px;margin:8px 0}
.pk-cover-controls label{flex:1;min-width:150px;margin:0}
.pk-cover-controls button{flex:1;min-width:155px}
.pk-cover-controls button.primary{background:#e1eefc;border:1px solid #3570b0;font-weight:bold}
#pixelOverlay.wardrobe-source-pixel .pk-ref-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:3px;margin:5px 0 8px}
#pixelOverlay.wardrobe-source-pixel .pk-ref-grid button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:3px 1px;min-width:0;background:#e3edf9;border:1px solid #7289aa}
#pixelOverlay.wardrobe-source-pixel .pk-ref-grid button[aria-pressed=true]{background:#c0defd;outline:2px solid #e6b544}
#pixelOverlay.wardrobe-source-pixel .pk-ref-grid canvas{display:block;max-width:100%;width:41px;height:auto;aspect-ratio:64/112;object-fit:contain;image-rendering:pixelated;image-rendering:crisp-edges}
#pixelOverlay.wardrobe-source-pixel .pk-ref-grid span{font:9px Tahoma,Arial,sans-serif;color:#263b55}
#pixelOverlay.wardrobe-source-pixel #pk-ghost-gender{min-width:0;max-width:100%;font-size:11px}
#pixelOverlay.wardrobe-source-pixel #pkExportPixel{background:linear-gradient(#fbfff3,#c6e7bb);font-weight:bold}
/* Reference drawing workspace only: publishing remains in the game database UI. */
#pakaianpanel #pk-approve,#pakaianpanel #pk-export{display:none!important}
#pakaianpanel #pk-export-draft{background:linear-gradient(#f5fff5,#bde5bd);border-color:#438456;font-weight:bold}
@media(max-width:700px){header small{display:none}header{padding:7px 9px}.pk-layout{display:flex;flex-direction:column}.pk-aside,.pk-main,.pk-right{width:100%}}
</style>
</head>
<body>
<div id="root">
<header><strong>▨ LGR WARDROBE FIT · PIXEL EDITOR</strong>
<small>Male/Female resmi · overlay 4 arah · Export JSON referensi (tidak masuk game)</small>
<a href="./lgr-wardrobe-adjust.html">Adjust 24 Varian ↗</a> <a href="./genesis-base.html">Genesis Base ↗</a></header>
<section id="pakaianpanel" aria-label="Editor Pakaian LGR berbasis Genesis"></section>
</div>
<script src="./lafrich-puppet-core.js"></script>
<script src="./lgr1-raster.js"></script>
<script src="./lafrich-puppet-renderer.js"></script>
<script src="./lgr1-motion.js"></script>
<script src="./lgr-skin.js"></script>
<script src="./lgr-wear.js"></script>
<script src="./lgr-db.js"></script>
<script src="./lgr-actor.js"></script>
<script src="./lgr-wardrobe-cover.js?v=wardrobe-reference-export-3"></script>
<script src="./emotion-studio/shared-pixel-selection.js"></script>
<script src="./emotion-studio/shared-pixel-editor.js?v=wardrobe-reference-export-3"></script>
<script src="./mahluk-pakaian.js?v=wardrobe-reference-export-3"></script>
<script src="./mahluk-pakaian-pixel.js?v=wardrobe-reference-export-3"></script>
<script>
window.addEventListener("DOMContentLoaded",()=>{
 Promise.resolve(window.MahlukPakaian.init(document.getElementById("pakaianpanel")))
 .catch(e=>{const p=document.getElementById("pakaianpanel");
 p.textContent="Editor gagal dimuat: "+e.message;console.error(e)});
});
</script>
</body>
</html>
